plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.kaminosora.notedown'
    compileSdk 35

    defaultConfig {
        applicationId 'io.github.kaminosora.notedown'
        minSdk 26
        targetSdk 35
        versionCode 5
        versionName '1.2.0'
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        debug {
            // Reuse the existing debug-release identity when publishing an update.
            // Keep the keystore outside Git; ordinary local builds retain the default.
            def existingKeystore = System.getenv('NOTEDOWN_DEBUG_KEYSTORE')
            if (existingKeystore) {
                storeFile file(existingKeystore)
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError true
        checkReleaseBuilds false
    }
}
